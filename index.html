<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f9f9f7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gastos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; manifest-src 'self'; worker-src 'self'; form-action 'none'; base-uri 'none'">
<title>Gastos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10); --wash:rgba(11,11,11,.045);
  --c-ing:#2a78d6; --c-gas:#eb6834; --c-sal:#1baf7a; --c-alt:#e87ba4; --c-rec:#6250d6; --c-amar:#eda100; --c-mag:#e87ba4;
  --good:#0ca30c; --good-t:#006300; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --on-fill:#ffffff; --on-yellow:#0b0b0b;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --wash:rgba(255,255,255,.06);
    --c-ing:#3987e5; --c-gas:#d95926; --c-sal:#199e70; --c-alt:#d55181; --c-rec:#9085e9; --c-amar:#c98500; --c-mag:#d55181;
    --good-t:#0ca30c;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --wash:rgba(255,255,255,.06);
  --c-ing:#3987e5; --c-gas:#d95926; --c-sal:#199e70; --c-alt:#d55181; --c-rec:#9085e9; --c-amar:#c98500; --c-mag:#d55181;
  --good-t:#0ca30c;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 80px}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
header.top h1{font-size:22px;letter-spacing:-.01em}
.sub{color:var(--ink2);font-size:13px}
.lock{display:inline-flex;gap:6px;align-items:center;color:var(--ink2);font-size:12px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 12px;cursor:pointer;line-height:1.2}
.btn:hover{background:var(--wash)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.primary:hover{opacity:.88}
.btn.small{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--c-ing);outline-offset:2px}
nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--grid);margin:6px 0 16px;overflow:auto}
nav.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;margin:0 0 14px}
.filters .grp{display:flex;align-items:center;gap:8px}
.filters label.t{color:var(--ink2);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{background:none;border:0;padding:6px 11px;cursor:pointer;font-size:13px;border-right:1px solid var(--border)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--wash)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.card h3{font-size:15px;margin-bottom:2px}
.card .desc{color:var(--ink2);font-size:12px;margin-bottom:10px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:680px){.g2,.g3,.g4{grid-template-columns:1fr}}
.hero{display:flex;flex-wrap:wrap;gap:8px 28px;align-items:flex-end;justify-content:space-between}
.hero .big{font-size:52px;line-height:1.05;font-weight:600;letter-spacing:-.02em}
.hero .lbl{color:var(--ink2);font-size:13px;margin-bottom:4px}
.hero .note{color:var(--ink2);font-size:13px}
.tile .lbl{color:var(--ink2);font-size:12px;margin-bottom:6px}
.tile .val{font-size:26px;font-weight:600;letter-spacing:-.01em}
.tile .det{color:var(--ink2);font-size:12px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;margin-top:8px}
.chip i{font-style:normal;display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;font-size:10px;font-weight:700;color:#fff}
.chip.good i{background:var(--good)} .chip.warn i{background:var(--warn);color:#0b0b0b} .chip.serious i{background:var(--serious);color:#0b0b0b} .chip.crit i{background:var(--crit)} .chip.na i{background:var(--muted)}
.banner{border:1px solid var(--border);border-left:4px solid var(--warn);background:var(--surface);border-radius:8px;padding:10px 14px;margin:0 0 10px;font-size:13px}
.banner.crit{border-left-color:var(--crit)} .banner.info{border-left-color:var(--c-ing)}
.banner b{font-weight:600}
.chartcard .head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink2);margin:2px 0 4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px}
.swl{display:inline-block;width:16px;height:0;border-top:2px solid}
.swl.d{border-top-style:dashed}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font:11px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--muted)}
.chart text.ink{fill:var(--ink2)}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--surface);border:1px solid var(--border);box-shadow:0 4px 18px rgba(0,0,0,.14);border-radius:8px;padding:8px 10px;font-size:12px;min-width:160px;display:none}
.tip .tt{color:var(--ink2);margin-bottom:4px}
.tip .row{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-top:2px}
.tip .row .k{display:flex;align-items:center;gap:6px;color:var(--ink2)}
.tip .row .v{font-weight:600;color:var(--ink)}
.tip .ln{display:inline-block;width:12px;border-top:2px solid}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th,table.t td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--grid);white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{color:var(--ink2);font-weight:500}
.tscroll{overflow:auto;max-height:340px}
.hbar{display:grid;grid-template-columns:150px 1fr 150px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.hbar .trk{height:10px}
.hbar .fill{height:10px;border-radius:0 4px 4px 0;background:var(--c-gas)}
.hbar .nm{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .vl{text-align:right;color:var(--ink2);font-size:12px}
.hbar .vl b{color:var(--ink);font-weight:600}
@media(max-width:600px){.hbar{grid-template-columns:100px 1fr 110px}}
.alt{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--grid)}
.alt:first-child{border-top:0}
.alt h4{font-size:14px}
.alt p{margin:3px 0 0;color:var(--ink2);font-size:13px}
.alt .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:11.5px;border:1px solid var(--border);border-radius:99px;padding:2px 8px;color:var(--ink2);white-space:nowrap}
.pill.rec{border-color:var(--ink);color:var(--ink);font-weight:600}
.alt input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--ink)}
.alt .imp{text-align:right;white-space:nowrap}
.alt .imp b{font-size:16px}
.alt .imp span{display:block;color:var(--ink2);font-size:11.5px}
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:12px;color:var(--ink2)}
.fld input,.fld select{background:var(--page);border:1px solid var(--border);border-radius:8px;padding:7px 9px;width:100%}
.fld.chk{flex-direction:row;align-items:center;gap:8px}
.fld.chk input{width:auto}
.stack>*+*{margin-top:14px}
.muted{color:var(--ink2)}
.sbar{display:flex;gap:2px;height:28px}
.sbar div{border-radius:4px;display:flex;align-items:center;padding-left:6px;font-size:12px;font-weight:600;color:var(--on-fill);overflow:hidden;white-space:nowrap}
.sbar div.y{color:var(--on-yellow)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:8px;font-size:13px;z-index:60;display:none}
details summary{cursor:pointer;color:var(--ink2)}
.ro{opacity:.55}

/* ---- cuentas, captura rápida y listas de movimientos ---- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-b{border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-height:40px}
.chip-b:hover{background:var(--wash)}
.chip-b[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dotc{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--surface)}
.chip-b[aria-pressed="true"] .dotc{box-shadow:0 0 0 2px var(--ink)}
.qcseg{width:100%;margin-bottom:12px}.qcseg button{flex:1;padding:10px 11px;font-size:15px}
form.qf{display:flex;flex-direction:column;gap:12px}
.amtw{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:12px;background:var(--page);padding:4px 14px}
.amtw span{font-size:28px;color:var(--ink2)}
.amtw input.amt{border:0;background:none;font-size:34px;font-weight:600;padding:8px 0;width:100%;min-width:0;outline:0}
.amtw:focus-within{outline:2px solid var(--c-ing);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.big{padding:14px 16px;font-size:16px;font-weight:600;border-radius:12px;width:100%}
.mvs{display:flex;flex-direction:column}
.mv{border-top:1px solid var(--grid);padding:10px 2px}
.mv:first-child{border-top:0}
.mv .row1{display:flex;justify-content:space-between;gap:12px;align-items:baseline;cursor:pointer;min-height:28px}
.mv .c{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mv .a{font-weight:600;white-space:nowrap}
.mv .a.in{color:var(--good-t)}
.mv .s{color:var(--ink2);font-size:12px;margin-top:1px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mv .edit{margin-top:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end;background:var(--wash);border-radius:10px;padding:10px}
.atile{text-align:left;cursor:pointer;width:100%}
.atile:hover{background:var(--wash)}
.atile[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:-1px}
.atile .lbl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.synctxt{width:100%;background:var(--page);border:1px solid var(--border);border-radius:8px;padding:8px;font:12px/1.35 ui-monospace,Consolas,monospace;word-break:break-all}
nav.tabs .ic{display:none}
nav.tabs .sm{display:none}
@media(max-width:680px){
  .wrap{padding:12px 12px calc(88px + env(safe-area-inset-bottom))}
  header.top h1{font-size:19px}
  header.top{margin-bottom:6px}
  .hero .big{font-size:40px}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:40;background:var(--surface);border-top:1px solid var(--border);border-bottom:0;display:grid;grid-template-columns:repeat(5,1fr);gap:0;padding-bottom:env(safe-area-inset-bottom);overflow:visible}
  nav.tabs button{padding:8px 2px 9px;font-size:11px;border-bottom:0;border-top:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px}
  nav.tabs button[aria-selected="true"]{border-top-color:var(--ink)}
  nav.tabs .ic{display:block;line-height:0}
  nav.tabs .lg{display:none}nav.tabs .sm{display:inline}
  .fld input,.fld select,.mv .edit select,.mv .edit input[type=text],.synctxt,textarea,.btn{font-size:16px}
  .fld input,.fld select,.mv .edit select{min-height:44px}
  .grid.gacc{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.gacc .tile .val{font-size:22px}.gacc .card{padding:12px}
  .btn{min-height:42px}.btn.small{min-height:36px;font-size:13px}
  .fld input[type=checkbox],.mv .edit input[type=checkbox]{min-height:0;width:22px;height:22px}
  .toast{bottom:calc(78px + env(safe-area-inset-bottom))}
  .card{padding:14px}
  form.f{grid-template-columns:1fr}
  .filters{gap:10px 14px}
  .seg button{padding:9px 11px}
  .tip{max-width:80vw}
}
@media print{.tools,nav.tabs,.filters,.btn{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Gestor de gastos</h1>
      <div class="sub"><span class="lock">🔒 Sin conexión: tus datos solo viven en este navegador.</span></div>
    </div>
    <div class="tools" id="tools"></div>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="view"></main>
</div>
<div class="tip" id="tip" role="status"></div>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
/*ENGINE_START*/
/* ---------- utilidades de fecha ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2],12,0,0)};
const mkOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const mkParse=k=>{const a=k.split('-').map(Number);return{y:a[0],m:a[1]}};
const mkAdd=(k,n)=>{const p=mkParse(k);const t=p.y*12+(p.m-1)+n;return Math.floor(t/12)+'-'+pad(t%12+1)};
const mkDiff=(a,b)=>{const A=mkParse(a),B=mkParse(b);return(B.y*12+B.m)-(A.y*12+A.m)};
const daysIn=k=>{const p=mkParse(k);return new Date(p.y,p.m,0).getDate()};
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const mkLabel=(k,withYear)=>{const p=mkParse(k);return MES[p.m-1]+(withYear?' '+String(p.y).slice(2):'')};
const mkLong=k=>{const p=mkParse(k);return MESL[p.m-1]+' '+p.y};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const sum=a=>a.reduce((x,y)=>x+y,0);
const nextWd=(s,wd)=>{let d=parse(s);while(d.getDay()!==wd)d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1,12);return iso(d)};
function paydays(k,wd){const p=mkParse(k),n=daysIn(k),out=[];for(let d=1;d<=n;d++){const dt=new Date(p.y,p.m-1,d,12);if(dt.getDay()===wd)out.push(iso(dt))}return out}

/* ---------- catálogo ---------- */
const CATS=[
 {id:'vivienda',n:'Vivienda',e:1},{id:'alimentos',n:'Alimentación',e:1},{id:'transporte',n:'Transporte',e:1},
 {id:'servicios',n:'Servicios, seguros y telefonía',e:1},{id:'salud',n:'Salud',e:1},{id:'educacion',n:'Educación',e:1},
 {id:'deudas',n:'Tarjetas, créditos y deudas',e:1},{id:'gobierno',n:'Impuestos y gobierno',e:1},
 {id:'efectivo',n:'Retiros de efectivo',e:0},{id:'ocio',n:'Ocio y restaurantes',e:0},{id:'suscripciones',n:'Suscripciones',e:0},
 {id:'compras',n:'Compras personales',e:0},{id:'otros',n:'Otros',e:0}];
const catName=id=>(CATS.find(c=>c.id===id)||{n:id}).n;
const catEss=id=>{const c=CATS.find(c=>c.id===id);return c?!!c.e:false};
const FREQ={semanal:52/12,quincenal:2,mensual:1,bimestral:.5,anual:1/12};

/*SEED_START*/
const BUILD_MOVIL=true;
const COBERTURA={desde:null,hasta:null,huecos:[]};
const SEED_NOM=[],SEED_EXTRA=[],NOM_INFO=null,SEED_SALDOS=[],SEED_RECUR=[],SEED_BANK={gastos:[],ingresos:[],movs:[]};
/*SEED_END*/

const CUENTAS0=[{n:'Banamex',t:'debito'},{n:'Nu',t:'credito'},{n:'Plata',t:'credito'},{n:'Efectivo',t:'efectivo'}];
const CTIPOS={debito:'Cuenta de débito',credito:'Tarjeta de crédito',efectivo:'Efectivo'};
/* completa campos nuevos en respaldos y datos guardados con versiones anteriores */
function migrate(o){
  const s=o.settings||(o.settings={});
  if(!Array.isArray(s.cuentas)||!s.cuentas.length)s.cuentas=CUENTAS0.map(c=>Object.assign({},c));
  ['gastos','ingresos','recurrentes','eventos','movimientos','saldos','alternativas'].forEach(k=>{if(!Array.isArray(o[k]))o[k]=[]});
  o.gastos.forEach(g=>{if(g.cuenta==null)g.cuenta=g.src==='banco'?'Banamex':''});
  o.ingresos.forEach(i=>{if(i.cuenta==null)i.cuenta=i.banco?'Banamex':''});
  o.recurrentes.forEach(r=>{if(r.cuenta==null)r.cuenta=/^r\d/.test(r.id||'')?'Banamex':''});
  return o}
function seedState(){
  const ing=[];
  SEED_NOM.forEach((r,i)=>ing.push({id:'n'+i,fecha:r[0],tipo:'nomina',concepto:'Nómina semanal',bruto:r[1],ded:r[2],neto:r[3],vales:r[4],imp:r[5],imss:r[6],caja:r[7],foah:r[8],amort:r[9]}));
  SEED_EXTRA.forEach((r,i)=>ing.push({id:'x'+i,fecha:r[0],tipo:'extra',concepto:r[1],bruto:r[2],imp:r[3],neto:r[4]}));
  SEED_BANK.ingresos.forEach((r,i)=>ing.push({id:'bi'+i,fecha:r.fecha,tipo:'extra',concepto:r.concepto,neto:r.neto,banco:1}));
  return migrate({v:2,
    settings:{saldo:null,metaAhorro:10,mesesFondo:3,umbralHormiga:100,estimarFaltantes:true,incluirVales:false,deudasVar:'incluir',ocultar:false,tema:'auto',horizonte:3,escenario:'base',ventana:6,
      cobertura:JSON.parse(JSON.stringify(COBERTURA))},
    ingresos:ing,
    gastos:SEED_BANK.gastos.map(g=>Object.assign({},g,{src:'banco'})),
    recurrentes:SEED_RECUR.map((r,i)=>Object.assign({id:'r'+i,fin:null},r)),
    eventos:[],alternativas:[],movimientos:SEED_BANK.movs.slice(),saldos:SEED_SALDOS.slice(),nomInfo:NOM_INFO?Object.assign({},NOM_INFO):null});
}

/* ---------- recurrentes ---------- */
function occRec(r,k){
  const ini=parse(r.inicio),fin=r.fin?parse(r.fin):null,out=[],nd=daysIn(k),p=mkParse(k);
  const push=dt=>{if(dt>=ini&&(!fin||dt<=fin))out.push(dt)};
  const D=d=>new Date(p.y,p.m-1,d,12);
  switch(r.frecuencia){
    case'semanal':for(let d=1;d<=nd;d++){const dt=D(d);if(dt.getDay()===ini.getDay())push(dt)}break;
    case'quincenal':{const b=ini.getDate(),c=b<=15?b+15:b-15;[...new Set([Math.min(b,nd),Math.min(c,nd)])].forEach(d=>push(D(d)));break}
    case'mensual':push(D(Math.min(ini.getDate(),nd)));break;
    case'bimestral':{const df=mkDiff(mkOf(ini),k);if(df>=0&&df%2===0)push(D(Math.min(ini.getDate(),nd)));break}
    case'anual':if(ini.getMonth()===p.m-1)push(D(Math.min(ini.getDate(),nd)));break;
  }
  return out;
}

/* ---------- ajuste de tendencia (mínimos cuadrados con amortiguación) ---------- */
function fitSeries(pts,targets){
  const n=pts.length;
  if(!n)return{n:0,mean:0,level:0,slope:0,slopePct:0,sigma:0,proj:targets.map(()=>0),band:targets.map(()=>0)};
  const ys=pts.map(p=>p.y),xs=pts.map(p=>p.x),mean=avg(ys),xm=avg(xs);
  let sxx=0,sxy=0;pts.forEach(p=>{sxx+=(p.x-xm)**2;sxy+=(p.x-xm)*(p.y-mean)});
  let b=(n>=2&&sxx>0)?sxy/sxx:0;
  b*=(n>=5?1:n===4?.85:n===3?.7:.5);
  const cap=.12*Math.abs(mean);b=Math.max(-cap,Math.min(cap,b));
  const a=mean-b*xm,xLast=Math.max.apply(null,xs),lvl=a+b*xLast;
  let sse=0;pts.forEach(p=>{const e=p.y-(a+b*p.x);sse+=e*e});
  let s=n>2?Math.sqrt(sse/(n-2)):.1*Math.abs(mean);s=Math.max(s,.05*Math.abs(mean));
  const phi=.75,proj=[],band=[];
  targets.forEach(x=>{
    const d=Math.max(0,x-xLast),damp=d>0?phi*(1-Math.pow(phi,d))/(1-phi):0;
    const y=x<=xLast?a+b*x:lvl+b*damp;proj.push(Math.max(0,y));
    const dx=x-xm;let w=s*Math.sqrt(1+1/n+(sxx>0?dx*dx/sxx:0));w=Math.min(w,Math.max(.6*Math.abs(lvl),.05*Math.abs(mean)));band.push(w);
  });
  return{n,mean,level:lvl,slope:b,slopePct:mean?b/mean:0,sigma:s,proj,band,xLast};
}

/* ---------- cobertura de gastos ---------- */
function covered(S,k){
  const c=S.settings.cobertura;if(!c||!c.desde)return null;
  const ms=k+'-01',me=k+'-'+pad(daysIn(k));
  if(ms<c.desde||me>c.hasta)return false;
  for(const h of(c.huecos||[]))if(!(me<h[0]||ms>h[1]))return false;
  return true;
}

/* ---------- modelo ---------- */
function buildModel(S,todayD){
  const st=S.settings,today=iso(todayD),cur=mkOf(todayD),H=st.horizonte,W=st.ventana;
  const nom=S.ingresos.filter(i=>i.tipo==='nomina').sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:0);
  const wd=nom.length?parse(nom[nom.length-1].fecha).getDay():0;
  const net=i=>(i.neto||0)+((st.incluirVales&&i.tipo==='nomina')?(i.vales||0):0);
  const base=avg(nom.slice(-8).map(net));
  let incTrend=null;
  if(nom.length>=8){const r4=avg(nom.slice(-4).map(net)),p=avg(nom.slice(-12,-4).map(net));if(p>0)incTrend=r4/p-1}
  /* semanas sin recibo */
  const estIng={},estDates=[];
  if(st.estimarFaltantes&&nom.length){
    const have=new Set(nom.map(i=>nextWd(i.fecha,wd)));
    let d=parse(nextWd(nom[0].fecha,wd));const miss=[];
    while(iso(d)<=today){if(!have.has(iso(d)))miss.push(iso(d));d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+7,12)}
    const lastNom=nom[nom.length-1].fecha;let run=[];
    const flush=()=>{if(!run.length)return;const tr=run[run.length-1]>lastNom;if(tr||run.length<=6)run.forEach(x=>{const k=x.slice(0,7);estIng[k]=(estIng[k]||0)+base;estDates.push(x)});run=[]};
    miss.forEach(x=>{if(run.length&&daysBetween(run[run.length-1],x)!==7)flush();run.push(x)});flush();
  }
  const payFuture={};
  for(let i=0;i<=H;i++){const k=mkAdd(cur,i);payFuture[k]=paydays(k,wd).filter(d=>d>today).length}
  /* ingresos por mes */
  const incAll={},incRecM={},incOtroM={},incExtraM={};
  S.ingresos.forEach(i=>{const k=i.fecha.slice(0,7),v=net(i);incAll[k]=(incAll[k]||0)+v;
    if(i.tipo==='extra')incExtraM[k]=(incExtraM[k]||0)+v;else incRecM[k]=(incRecM[k]||0)+v;
    if(i.tipo==='otro')incOtroM[k]=(incOtroM[k]||0)+v});
  Object.keys(estIng).forEach(k=>{incAll[k]=(incAll[k]||0)+estIng[k];incRecM[k]=(incRecM[k]||0)+estIng[k]});
  /* gastos por mes */
  const varM={},deuM={},recM={},nrM={},catM={},hormM={};
  S.gastos.forEach(g=>{const k=g.fecha.slice(0,7);
    if(g.nr){nrM[k]=(nrM[k]||0)+g.monto;return}
    if(g.rec)recM[k]=(recM[k]||0)+g.monto;
    else if(g.cat==='deudas')deuM[k]=(deuM[k]||0)+g.monto;
    else{varM[k]=(varM[k]||0)+g.monto;if(g.monto<st.umbralHormiga)hormM[k]=(hormM[k]||0)+g.monto}
    const c=catM[k]=catM[k]||{};c[g.cat]=(c[g.cat]||0)+g.monto});
  function recSched(k){let t=0,after=0;const byCat={};S.recurrentes.forEach(r=>occRec(r,k).forEach(dt=>{t+=r.monto;byCat[r.cat]=(byCat[r.cat]||0)+r.monto;if(iso(dt)>today)after+=r.monto}));return{t,after,byCat}}
  const recMonthly=sum(S.recurrentes.map(r=>r.monto*(FREQ[r.frecuencia]||1)));
  /* inicio de datos de gasto (modo manual sin cobertura) */
  let startGas=null;const cands=[];
  if(S.gastos.length){const f=S.gastos.map(g=>g.fecha).sort()[0];cands.push(parseInt(f.slice(8,10),10)>10?mkAdd(f.slice(0,7),1):f.slice(0,7))}
  if(S.recurrentes.length)cands.push(S.recurrentes.map(r=>r.inicio.slice(0,7)).sort()[0]);
  if(cands.length)startGas=cands.sort()[0];
  const hasGas=k=>{const c=covered(S,k);return c===null?(startGas!==null&&k>=startGas&&k<cur):c&&k<cur};
  /* historial */
  const hist=[],fitV=[],fitD=[],fitT=[],fitO=[];
  const firstOtro=Object.keys(incOtroM).sort()[0];
  for(let i=W;i>=1;i--){
    const k=mkAdd(cur,-i),hi=(incAll[k]||0)>0,hg=hasGas(k);
    const v=varM[k]||0,dd=deuM[k]||0,rc=(recM[k]||0)+recSched(k).t,nr=nrM[k]||0;
    const row={mk:k,kind:'hist',inc:hi?incAll[k]:null,incRec:hi?(incRecM[k]||0):null,incEst:estIng[k]||0,exp:hg?v+dd+rc+nr:null,expBase:hg?v+dd+rc:null,varg:hg?v+dd:null,cons:hg?v:null,deu:hg?dd:null,rec:hg?rc:null,nr:hg?nr:null,hasGas:hg};
    row.flow=(row.inc!=null&&row.exp!=null)?row.inc-row.exp:null;hist.push(row);
    const x=mkDiff('2000-01',k);
    if(hg){fitV.push({x,y:v});fitD.push(dd);fitT.push({x,y:v+dd+rc})}
    if(firstOtro&&k>=firstOtro)fitO.push({x,y:incOtroM[k]||0});
  }
  const tx=[];for(let i=0;i<=H;i++)tx.push(mkDiff('2000-01',mkAdd(cur,i)));
  const fitVar=fitSeries(fitV,tx),fitTot=fitSeries(fitT,tx),fitOtro=fitSeries(fitO,tx);
  const deuAvg=st.deudasVar==='excluir'?0:avg(fitD),deuSd=fitD.length>1?Math.sqrt(avg(fitD.map(y=>(y-avg(fitD))**2))):.2*deuAvg;
  const lastFit=fitV.length?fitV[fitV.length-1].x:null,gap=lastFit==null?99:mkDiff('2000-01',cur)-lastFit;
  const conf=fitV.length>=5&&gap<=2?'alta':fitV.length>=3&&gap<=3?'media':'baja';
  /* eventos */
  const events={};
  S.eventos.forEach(e=>{if(e.fecha<=today)return;const k=e.fecha.slice(0,7);const o=events[k]=events[k]||{ing:0,gas:0};if(e.tipo==='ingreso')o.ing+=e.monto;else o.gas+=e.monto});
  const recMonth={};for(let i=0;i<=H;i++){const k=mkAdd(cur,i);recMonth[k]=recSched(k)}
  const last3=hist.filter(r=>r.expBase!=null&&r.incRec!=null).slice(-3);
  const var3=last3.length?avg(last3.map(r=>r.cons)):0;
  /* categorías y hormiga sobre los últimos 3 meses con datos */
  const catAvg={};let tot=0,horm=0;
  last3.forEach(r=>{const c=catM[r.mk]||{};Object.keys(c).forEach(id=>{catAvg[id]=(catAvg[id]||0)+c[id]});
    S.recurrentes.forEach(()=>{});horm+=hormM[r.mk]||0});
  Object.keys(catAvg).forEach(id=>{catAvg[id]/=last3.length||1});
  const nrAvg=last3.length?avg(last3.map(r=>r.nr||0)):0;
  const varTotal3=sum(last3.map(r=>r.cons||0));
  return{deuAvg,deuSd,today,cur,H,W,wd,base,incTrend,estIng,estDates,payFuture,hist,fitVar,fitTot,fitOtro,nFit:fitV.length,gap,conf,events,recMonth,recMonthly,var3,catAvg,hormAvg:last3.length?horm/last3.length:0,hormShare:varTotal3>0?horm/varTotal3:0,nrAvg,last3,
    saldo:st.saldo==null?0:st.saldo,saldoSet:st.saldo!=null,
    cur0:{incAll:incAll[cur]||0,mtdVar:(varM[cur]||0)+(deuM[cur]||0),mtdOtro:incOtroM[cur]||0,recHist:recM[cur]||0},incExtraM,startGas};
}

function runProj(M,esc,mods){
  mods=mods||[];let saldo=M.saldo;const rows=[];
  const freeze=mods.some(m=>m.type==='freeze');
  const cutVar=sum(mods.filter(m=>m.type==='cutVar').map(m=>m.amount));
  const cutRec=sum(mods.filter(m=>m.type==='cutRec').map(m=>m.amount));
  for(let i=0;i<=M.H;i++){
    const k=mkAdd(M.cur,i),ev=M.events[k]||{ing:0,gas:0},rs=M.recMonth[k];
    let v0=M.fitVar.proj[i];const b=M.fitVar.band[i];
    if(i>=1){if(freeze&&M.var3)v0=Math.min(v0,M.var3);v0-=Math.min(cutVar,.4*v0)}
    let v=Math.max(0,v0+(esc==='cons'?b:esc==='opt'?-b:0));
    const dp=Math.max(0,M.deuAvg+(esc==='cons'?M.deuSd:esc==='opt'?-M.deuSd:0)),cons=v;v+=dp;
    let r=rs.t;if(i>=1)r-=Math.min(cutRec,.2*r);
    const o=M.fitOtro.proj[i];
    let inc,exp,cash;
    if(i===0){
      const otroRem=Math.max(0,o-M.cur0.mtdOtro),rem=M.payFuture[k]*M.base;
      inc=M.cur0.incAll+rem+otroRem+ev.ing;
      exp=Math.max(M.cur0.mtdVar,v)+r+M.cur0.recHist+ev.gas;
      cash=rem+otroRem+ev.ing-(Math.max(0,v-M.cur0.mtdVar)+rs.after+ev.gas);
    }else{
      inc=M.payFuture[k]*M.base+o+ev.ing;exp=v+r+ev.gas;cash=inc-exp;
    }
    saldo+=cash;
    rows.push({mk:k,i,kind:i===0?'cur':'proj',inc,exp,varg:i===0?Math.max(M.cur0.mtdVar,v):v,cons,deu:dp,rec:r+(i===0?M.cur0.recHist:0),flow:inc-exp,cash,saldo});
  }
  return rows;
}

/* ---------- indicadores ---------- */
function status(level,label){return{level,label,icon:level==='good'?'✓':level==='warn'?'!':level==='serious'?'▲':level==='crit'?'✕':'–'}}
function indicators(M,base){
  const L=M.last3,n=L.length;
  const avgInc=n?avg(L.map(r=>r.incRec)):null,avgExp=n?avg(L.map(r=>r.expBase)):null;
  const tasa=(avgInc>0&&avgExp!=null)?(avgInc-avgExp)/avgInc:null;
  const ind={n,avgInc,avgExp,tasa};
  ind.tasaS=tasa==null?status('na','Sin datos'):tasa>=.2?status('good','Sólida'):tasa>=.1?status('warn','Mejorable'):tasa>=0?status('serious','Baja'):status('crit','Déficit');
  const sp=M.fitTot.n>=2?M.fitTot.slopePct:null;ind.expTrend=sp;
  ind.expTrendS=sp==null?status('na','Datos insuficientes'):sp<=.005?status('good',sp<-.005?'A la baja':'Estable'):sp<=.03?status('warn','Al alza leve'):sp<=.06?status('serious','Al alza'):status('crit','Al alza fuerte');
  ind.incTrend=M.incTrend;
  ind.incTrendS=M.incTrend==null?status('na','Datos insuficientes'):M.incTrend>=-.02?status('good',M.incTrend>.02?'Al alza':'Estable'):M.incTrend>=-.06?status('warn','A la baja leve'):status('serious','A la baja');
  ind.colchon=(M.saldoSet&&avgExp>0)?M.saldo/avgExp:null;
  ind.colchonS=ind.colchon==null?status('na',M.saldoSet?'Sin gastos':'Captura tu saldo'):ind.colchon>=3?status('good','Cubierto'):ind.colchon>=1?status('warn','Parcial'):status('serious','Insuficiente');
  ind.cargaFija=avgInc>0?M.recMonthly/avgInc:null;
  ind.cargaFijaS=ind.cargaFija==null?status('na','Sin datos'):ind.cargaFija<=.35?status('good','Manejable'):ind.cargaFija<=.5?status('warn','Alta'):status('serious','Muy alta');
  ind.horm=M.hormShare;
  ind.hormS=n?(M.hormShare<=.05?status('good','Bajo'):M.hormShare<=.10?status('warn','Moderado'):status('serious','Alto')):status('na','Sin datos');
  const deb=M.catAvg.deudas||0;ind.debtShare=(avgExp>0)?deb/avgExp:null;
  ind.debtS=ind.debtShare==null?status('na','Sin datos'):ind.debtShare<=.2?status('good','Bajo'):ind.debtShare<=.35?status('warn','Considerable'):status('serious','Predominante');
  const neg=base.find(r=>r.saldo<0);ind.deficit=M.saldoSet?(neg?neg.mk:null):null;
  const lvl=[ind.tasaS,ind.expTrendS,ind.colchonS,ind.cargaFijaS,ind.debtS].map(s=>s.level);
  ind.global=(ind.deficit||lvl.includes('crit'))?status('crit','Crítico'):(lvl.filter(l=>l==='serious').length>=2||(tasa!=null&&tasa<0))?status('serious','Atención urgente'):lvl.includes('serious')||lvl.includes('warn')?status('warn','Atención'):n?status('good','Saludable'):status('na','Sin datos');
  return ind;
}

/* ---------- alternativas ---------- */
const money=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString('es-MX');
function buildAlts(S,M,ind,base){
  const st=S.settings,A=[],proj=base.slice(1);
  const flowAvg=avg(proj.map(r=>r.flow)),incAvg=avg(proj.map(r=>r.inc)),varAvg=avg(proj.map(r=>r.cons));
  if(ind.expTrend!=null&&ind.expTrend>.015&&M.var3){
    const imp=avg(proj.map(r=>Math.max(0,r.cons-M.var3)));
    if(imp>1)A.push({id:'freeze',titulo:'Congelar el gasto variable en su promedio reciente',detalle:'La tendencia empuja tu gasto variable hacia arriba. Fijar un tope mensual igual al promedio de los meses con datos ('+money(M.var3)+') evita que siga creciendo.',ahorro:imp,dif:1,mod:{type:'freeze'}});
  }
  Object.keys(M.catAvg).filter(id=>!catEss(id)&&M.catAvg[id]>0).sort((a,b)=>M.catAvg[b]-M.catAvg[a]).slice(0,2).forEach(id=>{
    const amt=.15*M.catAvg[id];
    if(amt>=30)A.push({id:'cut-'+id,titulo:'Reducir 15% en '+catName(id).toLowerCase(),detalle:'Es una de tus categorías discrecionales más pesadas: promedio de '+money(M.catAvg[id])+' al mes. Un recorte moderado no toca lo esencial.',ahorro:amt,dif:2,mod:{type:'cutVar',amount:amt}});
  });
  if(M.hormShare>=.05&&M.hormAvg>0){
    const amt=.5*M.hormAvg;
    A.push({id:'horm',titulo:'Controlar los gastos hormiga',detalle:'Los cargos menores a '+money(st.umbralHormiga)+' suman '+money(M.hormAvg)+' al mes ('+Math.round(100*M.hormShare)+'% de tu gasto variable). Reducirlos a la mitad casi no se nota en el día a día.',ahorro:amt,dif:1,mod:{type:'cutVar',amount:amt}});
  }
  const subM=sum(S.recurrentes.filter(r=>r.cat==='suscripciones').map(r=>r.monto*(FREQ[r.frecuencia]||1)));
  if(subM>=150)A.push({id:'subs',titulo:'Depurar suscripciones',detalle:'Tus suscripciones suman '+money(subM)+' al mes. Cancelar o compartir las que menos usas libera flujo sin tocar lo esencial.',ahorro:.3*subM,dif:1,mod:{type:'cutRec',amount:.3*subM}});
  if(incAvg>0&&varAvg>0){
    const target=st.metaAhorro/100*incAvg,gap=target-flowAvg,cap=.4*varAvg;
    if(gap>0){const amt=Math.min(gap,cap);
      A.push({id:'meta',titulo:'Llegar a una tasa de ahorro de '+st.metaAhorro+'%',detalle:gap<=cap?'Para ahorrar '+money(target)+' al mes necesitas recortar '+money(gap)+' ('+Math.round(100*gap/varAvg)+'% de lo que proyectas gastar en variables).':'La meta pide '+money(gap)+' al mes, más de lo que se puede recortar solo en gasto variable (máximo realista '+money(cap)+'). Habría que sumar ingreso adicional o renegociar pagos de deuda.',ahorro:amt,dif:gap<=cap*.5?2:3,mod:{type:'cutVar',amount:amt}});}
  }
  if(M.saldoSet&&ind.deficit&&varAvg>0){
    const need=Math.max.apply(null,base.map((r,i)=>i===0?0:(-r.saldo)/i)),cap=.4*varAvg,amt=Math.min(need,cap);
    if(need>0)A.push({id:'deficit',titulo:'Evitar quedarte sin saldo',detalle:'Con la tendencia actual el saldo se agota en '+mkLong(ind.deficit)+'. Evitarlo requiere liberar '+money(need)+' al mes'+(need>cap?', más de lo que alcanza a recortarse en variables ('+money(cap)+'): hay que combinar recortes con ingresos extra o con reestructurar pagos de deuda.':'.'),ahorro:amt,dif:3,mod:{type:'cutVar',amount:amt}});
  }
  /* informativas (sin efecto en la proyección) */
  if(ind.debtShare!=null&&ind.debtShare>.2)A.push({id:'info-deuda',info:true,titulo:'Ordenar el pago de tarjetas y créditos',detalle:'Los pagos de tarjetas y créditos son el '+Math.round(100*ind.debtShare)+'% de tus egresos de cuenta. Con los estados de tarjeta se puede separar lo que consumes de lo que abonas a deuda y priorizar por tasa de interés (primero la más cara).'});
  if(M.recMonthly>0&&ind.cargaFija!=null&&ind.cargaFija>.35)A.push({id:'info-fijos',info:true,titulo:'Revisar compromisos fijos',detalle:'Tus pagos recurrentes equivalen a '+money(M.recMonthly)+' al mes ('+Math.round(100*ind.cargaFija)+'% de tu ingreso). Pregunta si el crédito de nómina se puede reestructurar a un plazo mayor o con menor tasa; ahí está el mayor margen.'});
  if(M.saldoSet&&ind.avgExp>0){
    const meta=st.mesesFondo*ind.avgExp;
    A.push({id:'info-fondo',info:true,titulo:'Fondo de emergencia de '+st.mesesFondo+' meses',detalle:'Meta: '+money(meta)+'. Hoy tienes '+money(M.saldo)+' ('+Math.max(0,Math.round(100*M.saldo/meta))+'% de la meta). Mientras el flujo sea negativo, la prioridad es frenar la caída antes de apartar ahorro.'});
  }
  const dec=M.events&&Object.keys(M.events).length;
  if(!dec&&base.some(r=>r.mk.endsWith('-12')))A.push({id:'info-aguinaldo',info:true,titulo:'Planear el aguinaldo',detalle:'Diciembre suele traer un ingreso extra. Regístralo en "Captura → Eventos esperados" (hay un botón para sugerirlo) y decide de antemano a qué se destina: primero deuda cara o fondo de emergencia, no consumo.'});
  return A;
}
function diagnosis(S,M,ind,base,cons,opt){
  const L=[],end=base[base.length-1];
  if(!M.last3.length){L.push('Aún no hay meses completos con gastos e ingresos para calcular tendencia. Captura gastos o importa estados de cuenta.');return L}
  L.push('En los últimos '+M.last3.length+' meses con datos completos ('+M.last3.map(r=>mkLabel(r.mk)).join(', ')+') tu ingreso recurrente promedió '+money(ind.avgInc)+' y tus gastos '+money(ind.avgExp)+' al mes: flujo de '+money(ind.avgInc-ind.avgExp)+' ('+Math.round(100*ind.tasa)+'% del ingreso).');
  if(ind.expTrend!=null)L.push('La tendencia del gasto es '+ind.expTrendS.label.toLowerCase()+' ('+(ind.expTrend>=0?'+':'')+(100*ind.expTrend).toFixed(1)+'% mensual).');
  if(ind.cargaFija!=null&&ind.cargaFija>=1)L.push('Dato clave: tus pagos recurrentes ('+money(M.recMonthly)+' al mes, sobre todo el crédito de nómina) ya superan tu ingreso recurrente ('+money(ind.avgInc)+'). Aunque no gastaras nada más, el flujo sería negativo.');
  if(M.deuAvg>0){const f0=avg(base.slice(1).map(r=>r.flow));L.push('Los abonos variables a tarjetas promedian '+money(M.deuAvg)+' al mes; sin ellos el flujo proyectado sería de '+money(f0+M.deuAvg)+'. En mayo-julio esos abonos se cubrieron con ingresos extraordinarios (crédito, caja de ahorro y retiros de Ahorro Fácil), que no se repiten.')}

function analyze(S,todayD){
  const M=buildModel(S,todayD),base=runProj(M,'base'),cons=runProj(M,'cons'),opt=runProj(M,'opt');
  const ind=indicators(M,base),alts=buildAlts(S,M,ind,base),fin=base[base.length-1].saldo;
  alts.forEach(a=>{if(a.mod){const r=runProj(M,'base',[a.mod]);a.saldoFin=r[r.length-1].saldo;a.delta=a.saldoFin-fin}});
  const sel=alts.filter(a=>a.mod&&S.alternativas.indexOf(a.id)>=0).map(a=>a.mod);
  const withAlt=sel.length?runProj(M,'base',sel):null;
  const mods=alts.filter(a=>a.mod);let rec=mods.find(a=>a.id==='deficit');
  if(!rec&&mods.length)rec=mods.slice().sort((a,b)=>(b.ahorro/b.dif)-(a.ahorro/a.dif))[0];
  if(rec)rec.recomendada=true;
  return{M,base,cons,opt,withAlt,ind,alts,diag:diagnosis(S,M,ind,base,cons,opt)};
}
